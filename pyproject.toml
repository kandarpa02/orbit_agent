
[project]
name = "orbit"
version = "0.1.0"
description = "Orchestrated Runtime for Behavioral Intelligence and Tasks"
requires-python = ">=3.11"

dependencies = [
    "openai-agents>=0.24.0",
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "alembic>=1.17.0",
    "python-dotenv>=1.1.0",
    "typer>=0.20.0",
    "rich>=14.0.0",
    "playwright==1.65.1",
    "bs4",
    "ddgs==9.16.1"

]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["main*"]
exclude = ["workspace*"]